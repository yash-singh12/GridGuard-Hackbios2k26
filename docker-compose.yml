services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: gridguard-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - gridguard-net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: gridguard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - gridguard-net

networks:
  gridguard-net:
    driver: bridge
